---
services:

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    volumes:
      - ./mysql/data:/var/lib/mysql
    env_file: mysql/default.env
    cap_add:
      - SYS_NICE
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  fleet-migrate:
    image: fleetdm/fleet:${FLEET_VERSION:-latest}
    command: fleet prepare db --no-prompt
    env_file: fleet/default.env
    volumes:
      - ./fleet:/fleet/
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure

  fleet:
    image: fleetdm/fleet:${FLEET_VERSION:-latest}
    command: fleet serve
    restart: unless-stopped
    depends_on:
      fleet-migrate:
        condition: service_completed_successfully
    env_file: fleet/default.env
    volumes:
      - ./fleet:/fleet/
      - ./fleet/logs:/logs
      - ./fleet/vulndb:/vulndb
    labels:
      traefik.enable: true
      traefik.http.routers.fleet.entrypoints: "websecure"
      traefik.http.routers.fleet.rule: "Host(`${FLEET_DOMAIN:-fleet.example.com}`)"
      traefik.http.services.fleet.loadbalancer.server.port: "8412"
      traefik.http.routers.fleet.tls: true
      traefik.http.routers.fleet.tls.certresolver: "default"
    networks:
      - traefik_proxy
      - default

  traefik:
    image: traefik:v2.11
    container_name: traefik
    restart: unless-stopped
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config:/etc/traefik
    networks:
      - traefik_proxy
      - default
    ports:
      - "80:80"
      - "443:443"

networks:
  traefik_proxy:
    external: true
  default:
    driver: bridge
